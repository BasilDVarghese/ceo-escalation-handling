[project]
name = "ceo-escalation-handling"
version = "0.1.0"
description = "Multi-agent LangGraph app that triages, summarizes, and routes CEO escalation emails to the right team, pending human approval."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-core>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "anthropic>=1.0,<2.0",
    "google-api-python-client>=2.140,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-auth-httplib2>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "state", "graph", "db", "models", "gmail_client", "main"]
packages = ["agents"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
