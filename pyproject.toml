[project]
name = "ceo-escalation-handling"
version = "0.1.0"
description = "Multi-agent LangGraph app that triages, summarizes, and routes CEO escalation emails to the right team, pending human approval."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-core>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-aws>=1.0,<2.0",
    "anthropic>=1.0,<2.0",
    "boto3>=1.34,<2.0",
    "google-api-python-client>=2.140,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-auth-httplib2>=0.2,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0,<5.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "moto[dynamodb]>=5.0,<6.0", "httpx>=0.27,<1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "state", "graph", "db", "gmail_client", "main", "auth", "api", "pipeline"]
packages = ["agents", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
