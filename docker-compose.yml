services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    # -inMemory: data is lost on container restart — fine for dev iteration. Drop -inMemory
    # and mount a volume (e.g. -dbPath /data + a `volumes:` entry) if you want it to persist.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
